<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Sensortest</title>
    <style>
      html, body {
        margin: 0; height: 100%; background: #000; overflow: hidden;
        overscroll-behavior: none; touch-action: none; -webkit-text-size-adjust: 100%;
      }
      #cam { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      #ui {
        position: fixed; inset: 0; padding: env(safe-area-inset-top) 8px env(safe-area-inset-bottom);
        display: flex; flex-direction: column; gap: 6px; pointer-events: none;
      }
      #buttons { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
      button { pointer-events: auto; font-size: 16px; padding: 10px 14px; }
      pre {
        margin: 0; font: 12px/1.3 ui-monospace, Menlo, monospace;
        background: rgba(0, 0, 0, 0.6); padding: 5px 7px; border-radius: 6px;
        white-space: pre-wrap; align-self: flex-start;
      }
      #out { color: #0f0; }
      #console { color: #f77; max-height: 22vh; overflow: hidden; margin-top: auto; }
      #csv { pointer-events: auto; width: 100%; height: 80px; font-size: 11px; display: none; }
    </style>
  </head>
  <body>
    <video id="cam" playsinline webkit-playsinline muted autoplay></video>
    <div id="ui">
      <div id="buttons">
        <button id="start" type="button">Starta</button>
        <button id="rec" type="button" disabled>Spela in 30 s</button>
        <button id="copy" type="button" disabled>Kopiera logg</button>
      </div>
      <pre id="out">Tryck Starta.</pre>
      <textarea id="csv" readonly></textarea>
      <pre id="console">konsol: (inga fel)</pre>
    </div>
    <script type="module" src="/src/sensor-test.ts"></script>
  </body>
</html>
