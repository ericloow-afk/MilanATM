<!doctype html>
<html lang="sv" class="force-dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0e1114" />
    <title>Sensortest – Milano Metro AR</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/src/styles/tokens.css" />
    <link rel="stylesheet" href="/src/styles/components.css" />
    <style>
      html, body { height: 100%; overflow: hidden; touch-action: none; }
      #cam { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      #ui { position: fixed; inset: 0; box-sizing: border-box; padding: calc(var(--safe-top) + var(--space-2)) var(--gutter-right) calc(var(--safe-bottom) + var(--space-2)) var(--gutter); display: flex; flex-direction: column; gap: var(--space-2); pointer-events: none; }
      #ui > * { pointer-events: auto; }
      #buttons { display: flex; gap: var(--space-2); flex-wrap: wrap; }
      #buttons .btn { background: var(--surface-1); }
      #buttons .btn.primary { background: var(--accent); }
      pre { margin: 0; font: var(--fs-xs) / 1.4 var(--font-mono); font-variant-numeric: tabular-nums; padding: var(--space-2) var(--space-3); white-space: pre-wrap; overflow-wrap: anywhere; align-self: flex-start; max-width: 100%; box-sizing: border-box; }
      #out { color: var(--text); }
      #console { color: var(--danger); max-height: 22vh; overflow: hidden; margin-top: auto; }
      #csv { width: 100%; box-sizing: border-box; height: 80px; font: 11px var(--font-mono); display: none; background: var(--surface-2); color: var(--text); border: 1px solid var(--hairline-strong); border-radius: var(--radius-sm); }
    </style>
  </head>
  <body>
    <video id="cam" playsinline webkit-playsinline muted autoplay></video>
    <div id="ui">
      <div id="buttons">
        <button id="start" class="btn primary" type="button">Starta</button>
        <button id="rec" class="btn" type="button" disabled>Spela in 30 s</button>
        <button id="copy" class="btn" type="button" disabled>Kopiera logg</button>
      </div>
      <pre id="out" class="panel">Tryck Starta.</pre>
      <textarea id="csv" readonly aria-label="Logg som CSV"></textarea>
      <pre id="console" class="panel">konsol: (inga fel)</pre>
    </div>
    <script type="module" src="/src/sensor-test.ts"></script>
  </body>
</html>
