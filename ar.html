<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Milano Metro AR</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; touch-action: none; font-family: system-ui, sans-serif; color: #fff; }
      #bg { position: fixed; inset: 0; background: linear-gradient(#1b2a3a, #0c141d); }
      #cam { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      #gl { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; }
      #labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
      .label { position: absolute; left: 0; top: 0; pointer-events: auto; font-size: 12px; background: rgba(0,0,0,.6); border: 2px solid #fff; border-radius: 6px; padding: 2px 6px; white-space: nowrap; text-align: center; }
      .label.sel { background: rgba(255,255,255,.25); }
      .label.arrow { font-size: 11px; }
      .label .ar { display: inline-block; font-size: 20px; line-height: 1; }
      pre { margin: 0; font: 11px/1.3 ui-monospace, Menlo, monospace; }
      #hud { position: fixed; left: 8px; top: calc(env(safe-area-inset-top) + 6px); background: rgba(0,0,0,.55); padding: 4px 6px; border-radius: 6px; pointer-events: none; }
      #banner { position: fixed; left: 8px; right: 8px; top: calc(env(safe-area-inset-top) + 110px); background: #b3261e; padding: 6px 10px; border-radius: 6px; font-size: 13px; }
      #errors { position: fixed; left: 8px; right: 8px; bottom: calc(env(safe-area-inset-bottom) + 6px); color: #f88; background: rgba(0,0,0,.5); pointer-events: none; }
      #toolbar { position: fixed; right: 8px; top: calc(env(safe-area-inset-top) + 6px); display: flex; flex-direction: column; gap: 6px; }
      button, select { font-size: 14px; padding: 6px 10px; }
      .panel { position: fixed; background: rgba(0,0,0,.7); border-radius: 8px; padding: 8px; font-size: 12px; display: flex; flex-direction: column; gap: 6px; }
      .panel[hidden], #info[hidden], #banner[hidden], #start[hidden] { display: none; }
      .panel label { display: flex; align-items: center; gap: 6px; }
      .panel input[type=range] { flex: 1; min-width: 90px; }
      #cal { right: 8px; top: calc(env(safe-area-inset-top) + 90px); width: 220px; }
      #sim { left: 8px; bottom: calc(env(safe-area-inset-bottom) + 70px); width: 300px; }
      .small { font-size: 11px; opacity: .8; }
      #info { position: fixed; left: 8px; right: 8px; bottom: calc(env(safe-area-inset-bottom) + 70px); background: rgba(0,0,0,.8); border-radius: 8px; padding: 10px; font-size: 13px; line-height: 1.5; }
      #start { position: fixed; inset: 0; background: rgba(0,0,0,.85); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 20px; }
      #start button { font-size: 18px; padding: 12px 18px; }
    </style>
  </head>
  <body>
    <div id="bg" hidden></div>
    <video id="cam" playsinline webkit-playsinline muted autoplay hidden></video>
    <canvas id="gl"></canvas>
    <div id="ui"></div>
    <script type="module" src="/src/ar/main.ts"></script>
  </body>
</html>
